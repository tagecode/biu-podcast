name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads packageManager from package.json (pnpm@10.11.0)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Keep Node 22: jsdom/undici need markAsUncloneable (broken on Node 20).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / integration tests
        run: pnpm test

      - name: Compile (electron-vite)
        run: pnpm exec electron-vite build

  package:
    name: package (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 ships VS 2022 that node-gyp recognizes.
          # windows-latest currently has VS 18, which breaks better-sqlite3 rebuild.
          - os: windows-2022
            package_cmd: pnpm exec electron-builder --win --publish never
          - os: macos-latest
            package_cmd: pnpm exec electron-builder --mac --publish never
          - os: ubuntu-latest
            package_cmd: pnpm exec electron-builder --linux AppImage deb --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm exec electron-builder install-app-deps

      - name: Compile (electron-vite)
        run: pnpm exec electron-vite build

      - name: Package installer
        run: ${{ matrix.package_cmd }}
        env:
          # Unsigned CI artifacts are expected until T9.3 secrets are provisioned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biu-podcast-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
          if-no-files-found: error
