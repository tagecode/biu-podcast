name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads packageManager from package.json (pnpm@10.11.0)
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          # Pin Node 22.21.1: Node 22.23.x breaks electron-rebuild's node-gyp
          # (undici ERR_ASSERTION in better-sqlite3 postinstall rebuild).
          node-version: 22.21.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / integration tests
        run: pnpm test

      - name: Coverage gate (core domain ≥ 85%)
        run: pnpm test:coverage

      - name: Compile (electron-vite)
        run: pnpm exec electron-vite build

  e2e:
    name: e2e (Electron golden path + smoke)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron needs a display; xvfb-run is preinstalled on ubuntu runners.
      - name: E2E (Playwright _electron)
        run: xvfb-run -a pnpm test:e2e
