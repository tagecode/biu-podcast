name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 ships VS 2022 that node-gyp recognizes.
          # windows-latest currently has VS 18, which breaks better-sqlite3 rebuild.
          - os: windows-2022
            platform: win
            arch: x64
            build_cmd: pnpm exec electron-builder --win --publish never
          # macos-latest = macOS arm64 (Apple Silicon)
          - os: macos-latest
            platform: mac
            arch: arm64
            build_cmd: pnpm exec electron-builder --mac --publish never
          # macos-26-intel = macOS x64 (Intel)；在 Apple Silicon runner 上交叉编译
          - os: macos-26-intel
            platform: mac
            arch: x64
            build_cmd: pnpm exec electron-builder --mac --publish never
          - os: ubuntu-latest
            platform: linux
            arch: x64
            build_cmd: pnpm exec electron-builder --linux AppImage deb --publish never

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Match CI; release only packages, but keep the same toolchain.
          node-version: 22
          cache: pnpm

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile (electron-vite)
        run: pnpm exec electron-vite build

      - name: Package installer
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: biu-podcast-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts (Windows x64)
        uses: actions/download-artifact@v7
        with:
          name: biu-podcast-win-x64
          path: artifacts

      - name: Download artifacts (macOS arm64)
        uses: actions/download-artifact@v7
        with:
          name: biu-podcast-mac-arm64
          path: artifacts/mac-arm64

      - name: Download artifacts (macOS x64)
        uses: actions/download-artifact@v7
        with:
          name: biu-podcast-mac-x64
          path: artifacts/mac-x64

      - name: Download artifacts (Linux x64)
        uses: actions/download-artifact@v7
        with:
          name: biu-podcast-linux-x64
          path: artifacts

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > NOTES.md <<'EOF'
          ## 安装说明

          产物命名：`biu-podcast-v{version}-...`（Windows 为 `biu-podcast-v{version}-setup.exe`）

          | 平台 | 架构 | 格式 |
          |------|------|------|
          | Windows | x64 | `.exe`（NSIS 安装包，可选择安装目录） |
          | macOS | arm64 | `.dmg` / `.zip`（Apple Silicon） |
          | macOS | x64 | `.dmg` / `.zip`（Intel） |
          | Linux | x64 | `.AppImage` / `.deb` |

          > 未签名构建：macOS 首次打开需在「系统设置 → 隐私与安全性」中允许；Windows 若有 SmartScreen 提示，选择「更多信息 → 仍要运行」。
          EOF

      # gh is preinstalled on runners and auto-auth'd via GITHUB_TOKEN
      # (permissions: contents: write). Delete-then-create is idempotent:
      # a re-run deletes the previous draft/release and recreates it fresh,
      # unlike softprops/action-gh-release which 404s updating existing assets.
      - name: Delete existing release (idempotent)
        shell: bash
        run: |
          gh release delete "${{ steps.tag.outputs.name }}" --yes --repo "${{ github.repository }}" \
            || echo "No existing release to delete — creating fresh"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Collect artifacts to upload. mac-arm64 and mac-x64 each produce a
          # latest-mac.yml; both would flatten to the same filename, so keep
          # only the x64 one (mirrors what the previous release published).
          FILES="$(find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' \) \
            ! -path 'artifacts/mac-arm64/latest-mac.yml' | sort)"
          echo "Uploading:"
          echo "$FILES"
          # shellcheck disable=SC2046
          gh release create "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --notes-file NOTES.md \
            $FILES
