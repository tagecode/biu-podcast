<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>05 — 全屏播放器</title>
  <link rel="stylesheet" href="_shared.css">
  <style>
    .fs-back { position: absolute; top: 56px; left: 24px; display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); cursor: pointer; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="titlebar-dots"><span></span><span></span><span></span></div>
      <div class="titlebar-title">博播 BiuPodcast — 正在播放</div>
    </div>
    <div class="app-body" style="position:relative;">
      <div class="fs-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m15 18-6-6 6-6"/></svg>
        收起播放器
      </div>
      <div class="fullscreen-player">
        <div class="fs-cover"><div class="cover-placeholder" style="width:100%;height:100%;font-size:72px;background:linear-gradient(135deg,#F5E6C8,#E7E0D6);">科</div></div>
        <h1 class="fs-title">EP.128 — AI 时代的播客创作与分发</h1>
        <p class="fs-subtitle">科技乱炖</p>
        <div class="fs-progress">
          <div class="progress-track">
            <div class="progress-fill"></div>
            <div class="progress-thumb"></div>
          </div>
        </div>
        <div class="fs-times"><span>12:34</span><span>58:20</span></div>
        <div class="fs-controls">
          <button class="icon-btn" style="width:48px;height:48px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg></button>
          <button class="fs-play-btn"><svg width="28" height="28" viewBox="0 0 24 24" fill="#1C1917" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
          <button class="icon-btn" style="width:48px;height:48px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg></button>
        </div>
        <div style="margin-top:24px;display:flex;gap:16px;">
          <button class="btn btn-secondary" style="height:32px;font-size:13px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            已下载
          </button>
          <button class="btn btn-ghost" style="width:auto;padding:0 12px;height:32px;font-size:13px;color:var(--muted);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
            分享链接
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
