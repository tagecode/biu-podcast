<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>02 — 空状态</title>
  <link rel="stylesheet" href="_shared.css">
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="titlebar-dots"><span></span><span></span><span></span></div>
      <div class="titlebar-title">博播 BiuPodcast</div>
    </div>
    <div class="app-body">
      <div class="toolbar">
        <div class="app-logo">
          <div class="app-logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="1.75"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </div>
          <span class="app-logo-text">博播</span>
        </div>
        <div class="search-box" style="opacity:0.5;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          搜索播客…
        </div>
        <div class="toolbar-spacer"></div>
        <button class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          添加订阅
        </button>
      </div>
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>
        </svg>
        <h2 class="empty-title">还没有订阅任何播客</h2>
        <p class="empty-desc">粘贴 RSS Feed 地址即可开始收听。所有数据保存在本机，无需注册账号。</p>
        <button class="btn btn-primary" style="height:40px;padding:0 24px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          添加第一个订阅
        </button>
      </div>
    </div>
  </div>
</body>
</html>
