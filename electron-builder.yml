appId: com.biupodcast.app
productName: 博播 BiuPodcast
protocols:
  - name: 博播 BiuPodcast
    schemes:
      - biu-podcast
directories:
  buildResources: build
extraResources:
  - from: drizzle
    to: drizzle
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  extraResources:
    # SMTC companion process (Windows System Media Transport Controls bridge).
    - from: companion-win/bin/publish
      to: companion
  executableName: biu-podcast
  # --- Code signing (optional enhancement, T9.3 / Arch.md §15) ---
  # Signing is OPTIONAL: unsigned installers work but trigger a SmartScreen
  # "unknown publisher" prompt (user clicks "More info → Run anyway").
  # Prefer env vars that electron-builder reads automatically (do not commit
  # cert files). Open-source projects can apply to SignPath Foundation (free):
  #   CSC_LINK              — path or base64 of .pfx / .p12
  #   CSC_KEY_PASSWORD      — certificate password
  # Optional explicit fields (uncomment when wiring local CI secrets):
  # certificateFile: ${env.WIN_CSC_LINK}
  # certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}
  # signingHashAlgorithms: [sha256]
  # publisherName: 'Your Legal Entity Name'
nsis:
  artifactName: ${name}-v${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # --- Code signing & notarization (optional, T9.3 / Arch.md §15) ---
  # OPTIONAL: unsigned builds open after the user right-clicks → Open (or
  # "Privacy & Security" allow once). To enable, provide Apple credentials via
  # env (requires a paid Apple Developer Program — no free path):
  #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  #   (or ASC_API_KEY_ID / ASC_API_KEY_ISSUER_ID / ASC_API_KEY path)
  notarize: false
  # identity: null  # set to Developer ID Application: … when enabling signing
dmg:
  artifactName: ${name}-v${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: tagecode
  category: Audio
appImage:
  artifactName: ${name}-v${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: tagecode
  repo: biu-podcast
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
