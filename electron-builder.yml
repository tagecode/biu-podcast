appId: com.biupodcast.app
productName: 博播 BiuPodcast
directories:
  buildResources: build
extraResources:
  - from: drizzle
    to: drizzle
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: biu-podcast
  # --- Code signing (T9.3 / Arch.md §15) ---
  # Formal release MUST sign the Windows installer. Prefer env vars that
  # electron-builder reads automatically (do not commit cert files):
  #   CSC_LINK              — path or base64 of .pfx / .p12
  #   CSC_KEY_PASSWORD      — certificate password
  # Optional explicit fields (uncomment when wiring local CI secrets):
  # certificateFile: ${env.WIN_CSC_LINK}
  # certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}
  # signingHashAlgorithms: [sha256]
  # publisherName: 'Your Legal Entity Name'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # --- Code signing & notarization (T9.3 / Arch.md §15) ---
  # Formal release MUST enable notarization and provide Apple credentials via env:
  #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  #   (or ASC_API_KEY_ID / ASC_API_KEY_ISSUER_ID / ASC_API_KEY path)
  # Keep false for unsigned CI / local packaging only.
  notarize: false
  # identity: null  # set to Developer ID Application: … for release builds
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
